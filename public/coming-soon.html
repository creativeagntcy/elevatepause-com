  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #2a2661 0%, #3d1860 100%);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100svh;
      padding: 24px;
      line-height: 1.6;
    }

    .container {
      text-align: center;
      max-width: 600px;
      width: 100%;
    }

    .logo {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: clamp(28px, 6vw, 48px);
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 16px;
      letter-spacing: 0.02em;
    }

    .tagline {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: clamp(20px, 5vw, 32px);
      color: #f1efff;
      margin-bottom: 12px;
      font-weight: 600;
      letter-spacing: 0.01em;
    }

    .subtext {
      font-size: clamp(14px, 4vw, 18px);
      color: #c8c4e8;
      margin-bottom: 48px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .countdown-section {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      padding: 32px 24px;
      margin-bottom: 40px;
      border: 1px solid rgba(132, 207, 6, 0.2);
    }

    .countdown-label {
      font-size: 13px;
      color: #c8c4e8;
      margin-bottom: 20px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .countdown {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(70px, 1fr));
      gap: 12px;
      margin-bottom: 0;
    }

    .countdown-unit {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .countdown-value {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      font-size: clamp(24px, 5vw, 36px);
      font-weight: 700;
      color: #84cf06;
      line-height: 1;
    }

    .countdown-label-unit {
      font-size: 12px;
      color: #c8c4e8;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .cta-button {
      display: inline-block;
      background: #84cf06;
      color: #000;
      padding: 16px 40px;
      border-radius: 6px;
      border: none;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.04em;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s ease;
      margin-bottom: 40px;
      min-height: 44px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    }

    .cta-button:hover {
      background: #6aab05;
      transform: translateY(-2px);
      box-shadow: 0 12px 24px rgba(132, 207, 6, 0.3);
    }

    .cta-button:active {
      transform: translateY(0);
    }

    .footer {
      font-size: 14px;
      color: #c8c4e8;
      margin-top: 24px;
      letter-spacing: 0.02em;
      text-align: center;
    }
    .footer a { color: rgba(200,196,232,0.85); text-decoration: none; font-weight: 600; }
    .footer a:hover { color: #fff; }

    @media (max-width: 600px) {
      .container {
        padding: 16px;
      }

      .countdown-section {
        padding: 24px 16px;
      }

      .countdown {
        gap: 8px;
      }

      .countdown-unit {
        min-width: 60px;
      }

      .cta-button {
        padding: 14px 32px;
        font-size: 15px;
      }
    }

    /* High contrast for accessibility */
    @media (prefers-contrast: more) {
      .countdown-section {
        border: 2px solid rgba(132, 207, 6, 0.4);
      }

      .cta-button {
        border: 2px solid #2a2661;
      }
    }

    /* Reduced motion */
    @media (prefers-reduced-motion: reduce) {
      .cta-button {
        transition: none;
      }

      .cta-button:hover {
        transform: none;
      }
    }
  </style>
</head>
<body>
  <!-- Google Tag Manager (noscript) -->
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-54SHTBKF"
  height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
  <!-- End Google Tag Manager (noscript) -->

  <div class="container">
    <div class="logo">elevatePAUSE™ 2026</div>
    <div class="tagline">A clinician-led midlife and longevity summit</div>
    <div class="subtext">October 2 & 3, 2026 · Atlanta, GA</div>

    <div class="countdown-section">
      <div class="countdown-label">Launching in</div>
      <div class="countdown">
        <div class="countdown-unit">
          <div class="countdown-value" id="days">0</div>
          <div class="countdown-label-unit">Days</div>
        </div>
        <div class="countdown-unit">
          <div class="countdown-value" id="hours">0</div>
          <div class="countdown-label-unit">Hours</div>
        </div>
        <div class="countdown-unit">
          <div class="countdown-value" id="minutes">0</div>
          <div class="countdown-label-unit">Minutes</div>
        </div>
        <div class="countdown-unit">
          <div class="countdown-value" id="seconds">0</div>
          <div class="countdown-label-unit">Seconds</div>
        </div>
      </div>
    </div>

    <a href="https://shifther.myflodesk.com/community" target="_blank" rel="noopener noreferrer" class="cta-button">Join the Waitlist →</a>

    <div class="footer">
      <p>A shiftHER™ Experience</p>
      <p style="margin-top:8px; font-size:13px;">Powered by <a href="https://www.shiftherinc.com" target="_blank" rel="noopener">shiftHER&trade;</a> and <a href="https://www.jessicashepherdmd.com/modern-meno-community" target="_blank" rel="noopener">ModernMeno</a></p>
    </div>
  </div>

  <script>
    function updateCountdown() {
      const targetDate = new Date('2026-10-02T00:00:00').getTime();
      const now = new Date().getTime();
      const difference = targetDate - now;

      if (difference <= 0) {
        document.getElementById('days').textContent = '0';
        document.getElementById('hours').textContent = '0';
        document.getElementById('minutes').textContent = '0';
        document.getElementById('seconds').textContent = '0';
        return;
      }

      const days = Math.floor(difference / (1000 * 60 * 60 * 24));
      const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((difference % (1000 * 60)) / 1000);

      document.getElementById('days').textContent = String(days).padStart(2, '0');
      document.getElementById('hours').textContent = String(hours).padStart(2, '0');
      document.getElementById('minutes').textContent = String(minutes).padStart(2, '0');
      document.getElementById('seconds').textContent = String(seconds).padStart(2, '0');
    }

    // Update immediately on load
    updateCountdown();

    // Update every second
    setInterval(updateCountdown, 1000);
  </script>
</body>
</html>
